<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>IIAC 드라이브 내비게이터 (카카오맵)</title>

<script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=7ab262792dae44aa7df67bf94bc92440&autoload=false"></script>

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { darkMode: 'class' };
</script>

<style>
  html, body { height: 100%; margin: 0; overscroll-behavior: none; }
  body { font-family: -apple-system, "Malgun Gothic", sans-serif; }
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; background: #0d1117; }

  /* ---- map viewport / rotation rig ---- */
  #mapViewport {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    overflow: hidden;
    background: #1a1f27;
    touch-action: none;
  }
  #mapWrapper {
    position: absolute;
    top: -25%;
    left: -25%;
    width: 150%;
    height: 150%;
    transform-origin: center center;
    transition: transform 0.15s linear;
    will-change: transform;
  }
  #map { width: 100%; height: 100%; background: #1a1f27; touch-action: none; }

  /* dark mode: invert the whole map container (tiles + overlays alike, whatever
     Kakao renders them as internally), then counter-invert our own overlay content
     so pin/vehicle colors stay correct instead of also flipping. */
  #map.dark-map { filter: invert(100%) hue-rotate(180deg) brightness(0.92) contrast(0.9) saturate(0.9); }
  #map.dark-map .counter-invert { filter: invert(100%) hue-rotate(180deg); }

  /* ---- vehicle marker ---- */
  .veh-icon { width: 68px; height: 68px; overflow: visible; pointer-events: none; display: block; }

  /* ---- pin label (always readable) ---- */
  .pin-box { position: relative; width: 16px; height: 16px; }
  .pin-anchor { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); }
  .pin-wrap { pointer-events: auto; display: flex; flex-direction: column; align-items: center; transform-origin: center bottom; cursor: pointer; }
  .pin-label {
    background: #000;
    border: 1.5px solid #ffcc33;
    color: #fff;
    font-weight: 700;
    font-size: 11px;
    line-height: 1.3;
    padding: 3px 7px;
    border-radius: 6px;
    white-space: nowrap;
    box-shadow: 0 2px 6px rgba(0,0,0,0.5);
    margin-bottom: 3px;
    max-width: 160px;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .pin-dot { width: 10px; height: 10px; border-radius: 50%; background: #ffcc33; border: 2px solid #000; }

  /* ---- glass HUD ---- */
  .glass {
    background: rgba(13, 17, 23, 0.72);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.08);
  }
  .metric-num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; }
  .btn-toggle {
    transition: background-color .15s ease, color .15s ease, border-color .15s ease;
  }
  .btn-toggle.active { background: #ffc53d; color: #1a1200; border-color: #ffc53d; }

  #followBtn { transition: opacity .2s ease, transform .2s ease; }
  #followBtn.hidden-btn { opacity: 0; transform: scale(0.8) translateY(6px); pointer-events: none; }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: #3a4453; border-radius: 3px; }
</style>
</head>
<body class="dark">
<div id="app">

    <div class="flex rounded-lg overflow-hidden border border-white/10 shrink-0">

    <button id="wakeBtn" class="btn-toggle shrink-0 px-3 py-2 rounded-lg text-[12px] font-bold bg-white/5 text-slate-300 border border-white/10">화면 유지</button>

<!-- ===== shared access gate ===== -->
<div id="gateOverlay" class="fixed inset-0 z-[1000] flex items-center justify-center px-6" style="background:#0d1117;">
  <div class="glass rounded-2xl p-5 w-full max-w-xs text-white">
    <div class="text-base font-bold text-amber-300 mb-1" id="gateTitle">확인 중…</div>
    <div class="text-[12px] text-slate-400 mb-3" id="gateSubtitle"></div>
    <input id="gatePasswordInput" type="password" placeholder="공유 비밀번호" class="hidden w-full rounded-lg bg-white/10 border border-white/10 px-3 py-2 text-sm outline-none focus:border-amber-400" />
    <div id="gateError" class="hidden text-[12px] text-red-400 mt-2">비밀번호가 올바르지 않습니다.</div>
    <button id="gateSubmitBtn" class="hidden mt-3 w-full py-2 rounded-lg bg-amber-400 text-[#1a1200] text-sm font-bold">확인</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {
  getFirestore, collection, doc, getDoc, setDoc, addDoc, updateDoc, deleteDoc, onSnapshot, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

// Same Firebase project as the OSM/Leaflet version, so both map engines share the
// same pins and the same team password — swap this if the two should stay separate.
var firebaseConfig = {
  apiKey: "AIzaSyBVoRO7Tqc1AZVZpUht2piKNNTCGXjfyak",
  authDomain: "iiac-navi-bcf69.firebaseapp.com",
  projectId: "iiac-navi-bcf69",
  storageBucket: "iiac-navi-bcf69.firebasestorage.app",
  messagingSenderId: "476611551783",
  appId: "1:476611551783:web:471ebd0365801a09036402"
};
var fbApp = initializeApp(firebaseConfig);
var db = getFirestore(fbApp);
var pinsCol = collection(db, "pins");
var accessDocRef = doc(db, "meta", "access");

async function sha256Hex(str) {
  var buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(function (b) { return b.toString(16).padStart(2, "0"); }).join("");
}

// Soft access gate: hides the app behind a shared password backed by a hash in
// Firestore. Firestore's own rules stay open, so this is a courtesy lock for a
// trusted team, not real security.
(function initGate() {
  var GATE_REMEMBER_KEY = "iiac.drivenav.gateHash.v1";
  var overlay = document.getElementById("gateOverlay");
  var title = document.getElementById("gateTitle");
  var subtitle = document.getElementById("gateSubtitle");
  var input = document.getElementById("gatePasswordInput");
  var errorEl = document.getElementById("gateError");
  var submitBtn = document.getElementById("gateSubmitBtn");

  function unlock(hash) {
    try { localStorage.setItem(GATE_REMEMBER_KEY, hash); } catch (e) {}
    overlay.style.display = "none";
  }
  function showError(msg) {
    errorEl.textContent = msg;
    errorEl.classList.remove("hidden");
  }

  getDoc(accessDocRef).then(function (snap) {
    if (snap.exists()) {
      var storedHash = snap.data().passwordHash;
      var remembered = null;
      try { remembered = localStorage.getItem(GATE_REMEMBER_KEY); } catch (e) {}
      if (remembered && remembered === storedHash) { unlock(storedHash); return; }

      title.textContent = "공유 비밀번호 입력";
      subtitle.textContent = "팀에서 정한 비밀번호를 입력하세요.";
      input.classList.remove("hidden");
      submitBtn.classList.remove("hidden");
      submitBtn.addEventListener("click", function () {
        sha256Hex(input.value).then(function (hash) {
          if (hash === storedHash) { errorEl.classList.add("hidden"); unlock(storedHash); }
          else { showError("비밀번호가 올바르지 않습니다."); }
        });
      });
    } else {
      title.textContent = "공유 비밀번호 만들기";
      subtitle.textContent = "처음 실행이에요. 팀과 함께 쓸 비밀번호를 정해주세요.";
      input.classList.remove("hidden");
      submitBtn.classList.remove("hidden");
      submitBtn.textContent = "설정하고 시작";
      submitBtn.addEventListener("click", function () {
        var pw = input.value.trim();
        if (pw.length < 4) { showError("4자 이상 입력해 주세요."); return; }
        sha256Hex(pw).then(function (hash) {
          setDoc(accessDocRef, { passwordHash: hash }).then(function () {
            unlock(hash);
          }).catch(function () { showError("저장 실패, 다시 시도해 주세요."); });
        });
      });
    }
    input.addEventListener("keydown", function (e) { if (e.key === "Enter") submitBtn.click(); });
  }).catch(function () {
    title.textContent = "연결 오류";
    subtitle.textContent = "네트워크 상태를 확인하고 새로고침해 주세요.";
  });
})();

// Kakao's SDK is loaded with autoload=false, so kakao.maps.* isn't populated
// until this callback fires — everything that touches the map lives inside it.
// If the SDK script failed to load (network block, bad key) or its load
// callback never fires — e.g. this site's domain isn't registered in Kakao
// Developers → 플랫폼 → Web, which Kakao surfaces as its own alert() rather
// than a promise rejection we could catch — the map area would otherwise just
// stay silently blank. Surface that on screen instead of leaving it a mystery.
function showSdkError(msg) {
  document.getElementById("sdkErrorText").textContent = msg;
  document.getElementById("sdkErrorBanner").classList.remove("hidden");
}

if (typeof kakao === "undefined" || !kakao.maps) {
  showSdkError("카카오맵 스크립트 자체가 로드되지 않았습니다. 네트워크 상태를 확인하거나, 카카오 디벨로퍼스 → 내 애플리케이션 → 플랫폼에 이 사이트 도메인이 등록되어 있는지 확인해 주세요.");
} else {
  var kakaoLoaded = false;
  setTimeout(function () {
    if (!kakaoLoaded) {
      showSdkError("5초 안에 지도가 초기화되지 않았습니다. 카카오 디벨로퍼스 → 내 애플리케이션 → 플랫폼(Web)에 이 사이트 주소(https://hoogaem.github.io)가 정확히 등록되어 있는지 확인해 주세요.");
    }
  }, 5000);
  kakao.maps.load(function () {
  kakaoLoaded = true;
  "use strict";

  /* ============================================================
     STATE
  ============================================================ */
  var CENTER = { lat: 37.4485, lon: 126.4512 };
  var START_LEVEL = 3; // Kakao "level": lower = more zoomed in (roughly street scale)

  var mode = "nav";           // 'nav' (heading-up) | 'north' (north-up)
  var follow = true;
  var isDark = true;
  var wakeLock = null;
  var wakeOn = false;

  var smoothedHeading = 0;    // degrees, 0 = north
  var displaySpeedKmh = 0;
  var lastAccuracy = null;

  var lastAcceptedFix = null; // {lat, lon, tPerf, acc}
  var restAnchor = null;      // [lat, lon] resting point used to absorb GPS noise while stationary
  var animFrom = null, animTo = null, animStart = 0, animDur = 800;
  var animatedPos = [CENTER.lat, CENTER.lon];

  var compassHeading = null;
  var compassAvailable = false;

  var pins = [];
  var pinOverlays = []; // { overlay, el, id }
  var longPressTimer = null;
  var longPressStart = null;

  /* ============================================================
     MAP SETUP
  ============================================================ */
  var mapEl = document.getElementById("map");
  var map = new kakao.maps.Map(mapEl, {
    center: new kakao.maps.LatLng(CENTER.lat, CENTER.lon),
    level: START_LEVEL
  });
  map.setDraggable(false); // panning is fully custom (rotation-aware) — see below
  map.setZoomable(false);  // likewise for pinch/wheel/double-click zoom
  mapEl.classList.add("dark-map");

  var accuracyCircle = new kakao.maps.Circle({
    center: new kakao.maps.LatLng(CENTER.lat, CENTER.lon),
    radius: 15,
    strokeWeight: 1,
    strokeColor: "#4fd1ff",
    strokeOpacity: 0.8,
    fillColor: "#4fd1ff",
    fillOpacity: 0.12
  });
  accuracyCircle.setMap(map);

  var vehicleIconHtml =
    '<svg class="veh-icon" viewBox="0 0 68 68">' +
      '<defs><radialGradient id="fovGrad" cx="50%" cy="100%" r="100%">' +
        '<stop offset="0%" stop-color="#4fd1ff" stop-opacity="0.55"/>' +
        '<stop offset="100%" stop-color="#4fd1ff" stop-opacity="0"/>' +
      '</radialGradient></defs>' +
      '<path class="fov" d="M34 34 L14 4 A34 34 0 0 1 54 4 Z" fill="url(#fovGrad)"/>' +
      '<g class="arrow"><polygon points="34,16 44,42 34,35 24,42" fill="#4fd1ff" stroke="#0d1117" stroke-width="2" stroke-linejoin="round"/></g>' +
    '</svg>';

  var vehicleEl = document.createElement("div");
  vehicleEl.className = "counter-invert";
  vehicleEl.style.pointerEvents = "none";
  vehicleEl.innerHTML = vehicleIconHtml;
  var vehicleOverlay = new kakao.maps.CustomOverlay({
    position: new kakao.maps.LatLng(CENTER.lat, CENTER.lon),
    content: vehicleEl,
    xAnchor: 0.5,
    yAnchor: 0.5,
    zIndex: 100
  });
  vehicleOverlay.setMap(map);

  /* ============================================================
     GEO MATH
  ============================================================ */
  function toRad(d) { return d * Math.PI / 180; }
  function toDeg(r) { return r * 180 / Math.PI; }

  function haversine(lat1, lon1, lat2, lon2) {
    var R = 6371000;
    var dLat = toRad(lat2 - lat1);
    var dLon = toRad(lon2 - lon1);
    var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }
  function bearing(lat1, lon1, lat2, lon2) {
    var y = Math.sin(toRad(lon2 - lon1)) * Math.cos(toRad(lat2));
    var x = Math.cos(toRad(lat1)) * Math.sin(toRad(lat2)) -
            Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(toRad(lon2 - lon1));
    return (toDeg(Math.atan2(y, x)) + 360) % 360;
  }
  function shortestDelta(from, to) {
    var d = ((to - from + 540) % 360) - 180;
    return d;
  }
  function lerp(a, b, t) { return a + (b - a) * t; }

  /* ============================================================
     GPS: watchPosition + jitter filter + LERP animation
  ============================================================ */
  var gpsDot = document.getElementById("gpsDot");
  var gpsText = document.getElementById("gpsText");
  var gpsBanner = document.getElementById("gpsBanner");
  var gpsBannerText = document.getElementById("gpsBannerText");
  var hintEl = document.getElementById("hint");
  var watchHandle = null;

  function setGpsStatus(state, text) {
    gpsText.textContent = text;
    gpsDot.className = "status-dot " + (state === "ok" ? "bg-emerald-400" : state === "warn" ? "bg-red-400" : "bg-slate-500");
  }
  function showGpsBanner(msg) {
    gpsBannerText.textContent = msg;
    gpsBanner.classList.remove("hidden");
    hintEl.classList.add("hidden");
  }
  function hideGpsBanner() {
    gpsBanner.classList.add("hidden");
    hintEl.classList.remove("hidden");
  }

  function startGeolocation() {
    if (!window.isSecureContext) {
      setGpsStatus("warn", "HTTPS 필요");
      showGpsBanner("이 페이지가 보안 연결(HTTPS)이 아니어서 위치 정보를 가져올 수 없습니다. file://로 직접 연 경우 브라우저가 위치 기능을 차단합니다 — HTTPS로 호스팅된 주소에서 다시 열어주세요.");
      return;
    }
    if (!("geolocation" in navigator)) {
      setGpsStatus("warn", "GPS 미지원");
      showGpsBanner("이 브라우저는 위치 정보 기능을 지원하지 않습니다.");
      return;
    }
    setGpsStatus(null, "연결 중");
    if (watchHandle != null) navigator.geolocation.clearWatch(watchHandle);
    watchHandle = navigator.geolocation.watchPosition(onFix, onFixError, {
      enableHighAccuracy: true,
      maximumAge: 0,
      timeout: 3000
    });
  }
  document.getElementById("gpsRetryBtn").addEventListener("click", startGeolocation);
  startGeolocation();

  function onFixError(err) {
    if (err.code === err.PERMISSION_DENIED) {
      setGpsStatus("warn", "권한 거부됨");
      showGpsBanner("위치 권한이 거부되었습니다. 주소창의 자물쇠(사이트 정보) 아이콘 → 권한 → 위치를 '허용'으로 바꾼 뒤 새로고침하거나, 아래 버튼으로 다시 시도하세요.");
    } else if (err.code === err.TIMEOUT) {
      setGpsStatus("warn", "신호 없음");
      showGpsBanner("위치 신호를 받는 데 시간이 오래 걸리고 있습니다. GPS/위치 서비스가 켜져 있는지 확인해 주세요.");
    } else {
      setGpsStatus("warn", "신호 없음");
      showGpsBanner("위치를 확인할 수 없습니다. GPS/위치 서비스가 켜져 있는지 확인해 주세요.");
    }
  }

  function onFix(pos) {
    var now = performance.now();
    var lat = pos.coords.latitude, lon = pos.coords.longitude;
    var acc = pos.coords.accuracy;
    lastAccuracy = acc;

    var rawSpeedMs = pos.coords.speed;
    var rawHeading = pos.coords.heading;

    if (lastAcceptedFix) {
      var dt = (now - lastAcceptedFix.tPerf) / 1000;
      if (dt > 0.05) {
        var dist = haversine(lastAcceptedFix.lat, lastAcceptedFix.lon, lat, lon);
        var impliedSpeed = dist / dt;

        if (impliedSpeed > 55 && acc > 15) {
          setGpsStatus("warn", "신호 흔들림 보정 중");
          return;
        }
        if (acc > 100 && (now - lastAcceptedFix.tPerf) < 5000 && lastAcceptedFix.acc < 30) {
          return;
        }

        var speedKmh = rawSpeedMs != null ? rawSpeedMs * 3.6 : impliedSpeed * 3.6;
        displaySpeedKmh = Math.max(0, speedKmh);

        var effHeading = null;
        if (displaySpeedKmh >= 3 && rawHeading != null && !isNaN(rawHeading)) {
          effHeading = rawHeading;
        } else if (displaySpeedKmh >= 3) {
          effHeading = bearing(lastAcceptedFix.lat, lastAcceptedFix.lon, lat, lon);
        }
        if (effHeading != null) {
          smoothedHeading = (smoothedHeading + shortestDelta(smoothedHeading, effHeading) * 0.6 + 360) % 360;
        }
      }
    } else {
      displaySpeedKmh = rawSpeedMs != null ? Math.max(0, rawSpeedMs * 3.6) : 0;
    }

    var targetLat = lat, targetLon = lon;
    if (!restAnchor) {
      restAnchor = [lat, lon];
    } else {
      var distFromAnchor = haversine(restAnchor[0], restAnchor[1], lat, lon);
      var noiseRadius = Math.max(4, (acc || 10) * 0.7);
      if (distFromAnchor < noiseRadius) {
        targetLat = restAnchor[0];
        targetLon = restAnchor[1];
        displaySpeedKmh = 0;
      } else {
        restAnchor = [lat, lon];
      }
    }

    animFrom = animatedPos.slice();
    animTo = [targetLat, targetLon];
    animStart = now;
    var interval = lastAcceptedFix ? (now - lastAcceptedFix.tPerf) : 800;
    animDur = Math.min(Math.max(interval, 300), 2000);

    lastAcceptedFix = { lat: lat, lon: lon, tPerf: now, acc: acc };

    setGpsStatus("ok", "GPS 연결됨");
    hideGpsBanner();
    updateHud();
  }

  function updateHud() {
    document.getElementById("hudSpeed").innerHTML = Math.round(displaySpeedKmh) + '<span class="text-[10px] text-slate-400 font-normal ml-0.5">km/h</span>';
    document.getElementById("hudHeading").innerHTML = Math.round(smoothedHeading) + '<span class="text-[10px] text-slate-400 font-normal ml-0.5">°</span>';
    document.getElementById("hudAcc").innerHTML = "±" + (lastAccuracy != null ? Math.round(lastAccuracy) : "--") + '<span class="text-[10px] text-slate-400 font-normal ml-0.5">m</span>';
  }

  /* ============================================================
     DEVICE ORIENTATION (compass fallback at low speed)
  ============================================================ */
  // Raw device compass readings are noisy — handheld tremor and indoor magnetic
  // interference make the raw heading flicker several degrees frame to frame,
  // and since deviceorientation can fire dozens of times a second, even a modest
  // blend factor ends up chasing that noise and visibly shaking the whole
  // rotated map. Throttle how often we process events, ignore sub-threshold
  // wobble outright, and blend the rest in gently.
  var lastCompassProcessTime = 0;
  function handleOrientation(e) {
    var now = performance.now();
    if (now - lastCompassProcessTime < 150) return;
    lastCompassProcessTime = now;

    var h = null;
    if (typeof e.webkitCompassHeading === "number") {
      h = e.webkitCompassHeading;
    } else if (e.alpha != null) {
      h = 360 - e.alpha;
    }
    if (h == null || isNaN(h)) return;
    compassAvailable = true;
    compassHeading = (h + 360) % 360;
    if (displaySpeedKmh < 3) {
      var delta = shortestDelta(smoothedHeading, compassHeading);
      if (Math.abs(delta) < 2) return;
      smoothedHeading = (smoothedHeading + delta * 0.08 + 360) % 360;
      updateHud();
    }
  }

  function initCompass() {
    if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
      document.getElementById("compassPermBtn").classList.remove("hidden");
      document.getElementById("compassPermBtn").addEventListener("click", function () {
        DeviceOrientationEvent.requestPermission().then(function (state) {
          if (state === "granted") {
            window.addEventListener("deviceorientation", handleOrientation, true);
            document.getElementById("compassPermBtn").classList.add("hidden");
          }
        }).catch(function () {});
      });
    } else {
      window.addEventListener("deviceorientationabsolute", handleOrientation, true);
      window.addEventListener("deviceorientation", handleOrientation, true);
    }
  }
  initCompass();

  /* ============================================================
     ROTATION RIG (heading-up via CSS wrapper rotate — same trick as
     the Leaflet version; Kakao's Map class has no native bearing either)
  ============================================================ */
  var wrapper = document.getElementById("mapWrapper");
  var viewport = document.getElementById("mapViewport");
  var compassRing = document.getElementById("compassRing");
  var mapContainer = mapEl;

  function currentWrapperAngle() { return mode === "nav" ? -smoothedHeading : 0; }

  function applyRotation() {
    var a = currentWrapperAngle();
    wrapper.style.transform = "rotate(" + a + "deg)";
    compassRing.style.transform = "rotate(" + (-a) + "deg)";
    var rot = "rotate(" + smoothedHeading + " 34 34)";
    var arrowEl = vehicleEl.querySelector(".arrow");
    var fovEl = vehicleEl.querySelector(".fov");
    if (arrowEl) arrowEl.setAttribute("transform", rot);
    if (fovEl) fovEl.setAttribute("transform", rot);

    var counter = -a;
    pinOverlays.forEach(function (p) {
      var wrap = p.el.querySelector(".pin-wrap");
      if (wrap) wrap.style.transform = "rotate(" + counter + "deg)";
    });
  }

  function setMode(next) {
    mode = next;
    document.getElementById("navModeBtn").classList.toggle("active", mode === "nav");
    document.getElementById("northModeBtn").classList.toggle("active", mode === "north");
    applyRotation();
  }
  document.getElementById("navModeBtn").addEventListener("click", function () { setMode("nav"); });
  document.getElementById("northModeBtn").addEventListener("click", function () { setMode("north"); });
  setMode("nav");

  /* ============================================================
     FOLLOW / RECENTER
  ============================================================ */
  var followBtn = document.getElementById("followBtn");
  function setFollow(v) {
    follow = v;
    followBtn.classList.toggle("hidden-btn", follow);
  }
  followBtn.addEventListener("click", function () { setFollow(true); });
  setFollow(true);

  document.getElementById("zoomInBtn").addEventListener("click", function () { map.setLevel(map.getLevel() - 1); });
  document.getElementById("zoomOutBtn").addEventListener("click", function () { map.setLevel(map.getLevel() + 1); });

  /* ============================================================
     COORDINATE HELPERS (rotation-aware; container-point math is
     identical in spirit to the Leaflet version, using Kakao's own
     projection instead of Leaflet's containerPointToLatLng)
  ============================================================ */
  function screenToContainerPoint(clientX, clientY) {
    var vpRect = viewport.getBoundingClientRect();
    var vcx = vpRect.left + vpRect.width / 2;
    var vcy = vpRect.top + vpRect.height / 2;
    var dxScreen = clientX - vcx;
    var dyScreen = clientY - vcy;
    var a = toRad(-currentWrapperAngle());
    var dxMap = dxScreen * Math.cos(a) - dyScreen * Math.sin(a);
    var dyMap = dxScreen * Math.sin(a) + dyScreen * Math.cos(a);
    var w = mapContainer.clientWidth, h = mapContainer.clientHeight;
    return new kakao.maps.Point(w / 2 + dxMap, h / 2 + dyMap);
  }
  function screenToLatLng(clientX, clientY) {
    return map.getProjection().coordsFromContainerPoint(screenToContainerPoint(clientX, clientY));
  }
  function rotateScreenDeltaToMap(dx, dy) {
    var a = toRad(-currentWrapperAngle());
    return {
      x: dx * Math.cos(a) - dy * Math.sin(a),
      y: dx * Math.sin(a) + dy * Math.cos(a)
    };
  }

  // Pan/zoom built only on setCenter + getProjection, rather than panBy or
  // setLevel's {anchor} option — both turned out not to behave as documented
  // examples suggested (drag did nothing; zoom always pivoted on the map's
  // center instead of the pinch point), so this sticks to the two primitives
  // that are unambiguous: converting between container pixels and coordinates,
  // and setting the center directly.
  function panMapByPixels(dxMap, dyMap) {
    var w = mapContainer.clientWidth, h = mapContainer.clientHeight;
    var newCenterPt = new kakao.maps.Point(w / 2 - dxMap, h / 2 - dyMap);
    map.setCenter(map.getProjection().coordsFromContainerPoint(newCenterPt));
  }

  function zoomAroundLatLng(anchorLatLng, newLevel) {
    var beforePt = map.getProjection().containerPointFromCoords(anchorLatLng);
    map.setLevel(newLevel);
    var afterPt = map.getProjection().containerPointFromCoords(anchorLatLng);
    panMapByPixels(beforePt.x - afterPt.x, beforePt.y - afterPt.y);
  }

  /* ============================================================
     CUSTOM DRAG-PAN + PINCH-ZOOM (rotation-aware)
     Kakao's own draggable/zoomable are disabled above for the same
     reason as Leaflet's: their gesture math assumes an unrotated
     container, which breaks once the wrapper is visually rotated in
     heading-up mode. Panning mirrors the Leaflet version's panBy sign
     convention (content follows the finger).

     Kakao's setLevel only takes whole levels, so there's no way to make
     the map itself sit at an arbitrary in-between zoom. Instead, the
     entire pinch gesture is tracked as a free, uncapped CSS scale on
     #map (pivoting on the pinch midpoint) — you can stop your fingers
     at literally any magnification and it stays there while you're
     still touching the screen. Only on release do we settle: estimate
     how many whole levels that scale corresponds to (web map tile
     pyramids are conventionally 2x per level), commit that many levels
     in one shot, and ease away whatever small mismatch is left between
     the guessed 2x-per-level math and Kakao's actual scale — so the
     settle is a quick correction rather than an abrupt snap.
  ============================================================ */
  var activePointers = new Map();
  var singleDragLast = null;
  var pinchBaseDist = null;
  var lastPinchRatio = 1;
  var lastPinchMid = null;
  var gestureMoved = 0;
  var hadPinch = false; // true once a gesture involved 2 fingers, so a fast 2→0 release isn't mistaken for a tap

  function resetPinchVisualScale() {
    mapEl.style.transition = "";
    mapEl.style.transform = "";
  }

  function settlePinchZoom() {
    var ratio = lastPinchRatio;
    var mid = lastPinchMid;
    pinchBaseDist = null;
    lastPinchRatio = 1;
    lastPinchMid = null;

    if (!mid || Math.abs(ratio - 1) < 0.04) { resetPinchVisualScale(); return; }

    var levelsChanged = Math.round(Math.log2(ratio));
    if (levelsChanged === 0) {
      // didn't reach even one full level's worth of zoom — ease back to native size
      mapEl.style.transition = "transform 0.15s ease-out";
      mapEl.style.transform = "scale(1)";
      setTimeout(resetPinchVisualScale, 180);
      return;
    }

    var anchor = screenToLatLng(mid.x, mid.y);
    zoomAroundLatLng(anchor, map.getLevel() - levelsChanged);
    // the new level should already account for ~2^levelsChanged of the pinch;
    // whatever's left over gets eased out instead of assumed to be exactly zero
    var residual = ratio / Math.pow(2, levelsChanged);
    mapEl.style.transition = "none";
    mapEl.style.transform = "scale(" + residual + ")";
    void mapEl.offsetWidth; // force reflow so the next line actually transitions
    mapEl.style.transition = "transform 0.15s ease-out";
    mapEl.style.transform = "scale(1)";
    setTimeout(resetPinchVisualScale, 180);
    setFollow(false);
  }

  function onGesturePointerDown(e) {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    mapContainer.setPointerCapture(e.pointerId);
    activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY, t: performance.now() });
    if (activePointers.size === 1) {
      gestureMoved = 0;
      hadPinch = false;
      singleDragLast = { x: e.clientX, y: e.clientY };
      if (!movingPinId) startLongPress(e.clientX, e.clientY);
    } else {
      endLongPress();
      pinchBaseDist = null;
    }
  }

  function onGesturePointerMove(e) {
    if (!activePointers.has(e.pointerId)) return;
    activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY, t: performance.now() });
    var pts = Array.from(activePointers.values());

    if (pts.length === 1 && singleDragLast) {
      var dx = e.clientX - singleDragLast.x;
      var dy = e.clientY - singleDragLast.y;
      gestureMoved += Math.abs(dx) + Math.abs(dy);
      if (gestureMoved > 6) {
        endLongPress();
        var d = rotateScreenDeltaToMap(dx, dy);
        panMapByPixels(d.x, d.y);
        setFollow(false);
        singleDragLast = { x: e.clientX, y: e.clientY };
      }
    } else if (pts.length === 2) {
      endLongPress();
      hadPinch = true;
      var dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      var mid = { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };
      if (pinchBaseDist == null) {
        pinchBaseDist = dist;
        var originCp = screenToContainerPoint(mid.x, mid.y);
        mapEl.style.transition = "";
        mapEl.style.transformOrigin =
          (originCp.x / mapContainer.clientWidth * 100) + "% " +
          (originCp.y / mapContainer.clientHeight * 100) + "%";
      }
      var ratio = dist / pinchBaseDist;
      ratio = Math.max(0.2, Math.min(6, ratio));
      mapEl.style.transform = "scale(" + ratio + ")";
      lastPinchRatio = ratio;
      lastPinchMid = mid;
    }
  }

  function onGesturePointerUp(e) {
    activePointers.delete(e.pointerId);
    if (activePointers.size < 2 && pinchBaseDist != null) {
      settlePinchZoom();
    }
    if (activePointers.size === 1) {
      var remaining = Array.from(activePointers.values())[0];
      singleDragLast = remaining;
      gestureMoved = 0;
    } else if (activePointers.size === 0) {
      if (movingPinId && !hadPinch && gestureMoved <= 6) {
        var idToMove = movingPinId;
        var newLatLng = screenToLatLng(e.clientX, e.clientY);
        cancelMovePin();
        updateDoc(doc(db, "pins", idToMove), { lat: newLatLng.getLat(), lon: newLatLng.getLng() }).catch(function () {});
      }
      singleDragLast = null;
      endLongPress();
    }
  }

  // Some mobile browsers (Samsung Internet in particular has a known bug here)
  // occasionally drop the pointerup/pointercancel event after a touch ends,
  // especially with setPointerCapture in play — the pointer then sits in
  // activePointers forever, and every subsequent pointermove for some other
  // reason keeps re-applying its last delta, which reads as the map endlessly
  // drifting in one direction even though nothing is touching the screen.
  // lostpointercapture is the spec-correct event for "capture ended, for any
  // reason" and catches most of these; the timestamp watchdog below is the
  // fallback in case even that doesn't fire.
  mapContainer.addEventListener("lostpointercapture", onGesturePointerUp);

  var STALE_POINTER_MS = 700; // far longer than any real gap between touch events
  function releaseStalePointers() {
    var now = performance.now();
    activePointers.forEach(function (p, id) {
      if (now - p.t > STALE_POINTER_MS) {
        onGesturePointerUp({ pointerId: id, clientX: p.x, clientY: p.y });
      }
    });
  }

  // desktop convenience: wheel-to-zoom, anchored under the cursor
  mapContainer.addEventListener("wheel", function (e) {
    e.preventDefault();
    var anchor = screenToLatLng(e.clientX, e.clientY);
    zoomAroundLatLng(anchor, map.getLevel() + (e.deltaY > 0 ? 1 : -1));
    setFollow(false);
  }, { passive: false });

  /* ============================================================
     ANIMATION LOOP (LERP position + continuous rotation)
  ============================================================ */
  function tick() {
    releaseStalePointers();
    if (animFrom && animTo) {
      var t = animDur > 0 ? Math.min(1, (performance.now() - animStart) / animDur) : 1;
      animatedPos = [lerp(animFrom[0], animTo[0], t), lerp(animFrom[1], animTo[1], t)];
      var ll = new kakao.maps.LatLng(animatedPos[0], animatedPos[1]);
      vehicleOverlay.setPosition(ll);
      accuracyCircle.setPosition(ll);
      if (lastAccuracy != null) accuracyCircle.setRadius(lastAccuracy);
      if (t >= 1) { animFrom = null; }
    }
    // Recentering used to live inside the block above, so it only ever ran
    // while a GPS fix's LERP animation was actively in flight — tapping
    // "내 위치로" while stationary (no animation running) silently did
    // nothing until the next fix arrived. Keeping it here, unconditional on
    // animation state, means it recenters on animatedPos every frame follow
    // is on, GPS animating or not.
    if (follow) {
      map.setCenter(new kakao.maps.LatLng(animatedPos[0], animatedPos[1]));
    }
    applyRotation();
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  /* ============================================================
     PINS: shared via Firestore, live-synced to every viewer
  ============================================================ */
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&apos;" }[c];
    });
  }

  var pinLongPressTimer = null;
  var pinLongPressStart = null;
  function attachPinLongPress(el, pinId) {
    function onDown(e) {
      e.stopPropagation();
      if (movingPinId) return; // busy relocating another pin — ignore other pins for now
      pinLongPressStart = { x: e.clientX, y: e.clientY };
      clearTimeout(pinLongPressTimer);
      pinLongPressTimer = setTimeout(function () {
        pinLongPressStart = null;
        openDeleteModal(pinId);
      }, 600);
    }
    function onMove(e) {
      if (!pinLongPressStart) return;
      if (Math.abs(e.clientX - pinLongPressStart.x) > 10 || Math.abs(e.clientY - pinLongPressStart.y) > 10) {
        clearTimeout(pinLongPressTimer);
        pinLongPressStart = null;
      }
    }
    function onUp(e) {
      e.stopPropagation();
      clearTimeout(pinLongPressTimer);
      pinLongPressStart = null;
    }
    el.addEventListener("pointerdown", onDown);
    el.addEventListener("pointermove", onMove);
    el.addEventListener("pointerup", onUp);
    el.addEventListener("pointercancel", onUp);
    el.addEventListener("contextmenu", function (e) { e.preventDefault(); e.stopPropagation(); openDeleteModal(pinId); });
  }

  function renderPins() {
    pinOverlays.forEach(function (p) { p.overlay.setMap(null); });
    pinOverlays = [];
    pins.forEach(function (p) {
      var el = document.createElement("div");
      el.className = "pin-box counter-invert";
      el.innerHTML = '<div class="pin-anchor"><div class="pin-wrap"><div class="pin-label">' + escapeHtml(p.name) + '</div><div class="pin-dot"></div></div></div>';
      var overlay = new kakao.maps.CustomOverlay({
        position: new kakao.maps.LatLng(p.lat, p.lon),
        content: el,
        xAnchor: 0.5,
        yAnchor: 1,
        zIndex: 10
      });
      overlay.setMap(map);
      attachPinLongPress(el, p.id);
      pinOverlays.push({ overlay: overlay, el: el, id: p.id });
    });
  }

  function startPinsSync() {
    onSnapshot(pinsCol, function (snapshot) {
      pins = snapshot.docs.map(function (d) {
        var data = d.data();
        return { id: d.id, name: data.name, lat: data.lat, lon: data.lon };
      });
      renderPins();
    }, function () {
      setGpsStatus("warn", "핀 동기화 실패");
    });
  }

  var deleteModal = document.getElementById("deleteModal");
  var deleteModalName = document.getElementById("deleteModalName");
  var pinActionButtons = document.getElementById("pinActionButtons");
  var renameForm = document.getElementById("renameForm");
  var renameInput = document.getElementById("renameInput");
  var pendingDeleteId = null;
  function showPinActionButtons() {
    renameForm.classList.add("hidden");
    renameForm.classList.remove("flex");
    pinActionButtons.classList.remove("hidden");
    pinActionButtons.classList.add("flex");
  }
  function openDeleteModal(id) {
    var p = pins.find(function (x) { return x.id === id; });
    if (!p) return;
    pendingDeleteId = id;
    deleteModalName.textContent = "'" + p.name + "'";
    showPinActionButtons();
    deleteModal.classList.remove("hidden");
    deleteModal.classList.add("flex");
  }
  function closeDeleteModal() {
    deleteModal.classList.add("hidden");
    deleteModal.classList.remove("flex");
    pendingDeleteId = null;
  }
  document.getElementById("deleteCancelBtn").addEventListener("click", closeDeleteModal);
  document.getElementById("deleteConfirmBtn").addEventListener("click", function () {
    if (pendingDeleteId) {
      deleteDoc(doc(db, "pins", pendingDeleteId)).catch(function () {});
    }
    closeDeleteModal();
  });

  document.getElementById("renameStartBtn").addEventListener("click", function () {
    var p = pins.find(function (x) { return x.id === pendingDeleteId; });
    if (!p) return;
    renameInput.value = p.name;
    pinActionButtons.classList.add("hidden");
    pinActionButtons.classList.remove("flex");
    renameForm.classList.remove("hidden");
    renameForm.classList.add("flex");
    setTimeout(function () { renameInput.focus(); renameInput.select(); }, 50);
  });
  document.getElementById("renameCancelBtn").addEventListener("click", closeDeleteModal);
  document.getElementById("renameSaveBtn").addEventListener("click", function () {
    var name = renameInput.value.trim();
    if (!name || !pendingDeleteId) { closeDeleteModal(); return; }
    updateDoc(doc(db, "pins", pendingDeleteId), { name: name }).catch(function () {});
    closeDeleteModal();
  });
  renameInput.addEventListener("keydown", function (e) { if (e.key === "Enter") document.getElementById("renameSaveBtn").click(); });

  // Move mode: pick a pin from the delete/move modal, then the next plain tap
  // on the map (not a drag, not a long-press) relocates it there.
  var movingPinId = null;
  var moveBanner = document.getElementById("moveBanner");
  var moveBannerText = document.getElementById("moveBannerText");

  function startMovePin(id) {
    var p = pins.find(function (x) { return x.id === id; });
    if (!p) return;
    movingPinId = id;
    moveBannerText.textContent = "'" + p.name + "' 이동 — 새 위치를 지도에서 탭하세요.";
    moveBanner.classList.remove("hidden");
    hintEl.classList.add("hidden");
  }
  function cancelMovePin() {
    movingPinId = null;
    moveBanner.classList.add("hidden");
    hintEl.classList.remove("hidden");
  }
  document.getElementById("moveStartBtn").addEventListener("click", function () {
    var id = pendingDeleteId;
    closeDeleteModal();
    startMovePin(id);
  });
  document.getElementById("moveCancelBtn").addEventListener("click", cancelMovePin);

  startPinsSync();

  /* ============================================================
     LONG-PRESS TO ADD PIN (rotation-aware coordinate mapping)
  ============================================================ */
  var pendingLatLng = null;
  var pinModal = document.getElementById("pinModal");
  var pinModalCoords = document.getElementById("pinModalCoords");
  var pinNameInput = document.getElementById("pinNameInput");

  function openPinModal(latlng) {
    pendingLatLng = latlng;
    pinModalCoords.textContent = latlng.getLat().toFixed(5) + ", " + latlng.getLng().toFixed(5);
    pinNameInput.value = "";
    pinModal.classList.remove("hidden");
    pinModal.classList.add("flex");
    setTimeout(function () { pinNameInput.focus(); }, 50);
  }
  function closePinModal() {
    pinModal.classList.add("hidden");
    pinModal.classList.remove("flex");
    pendingLatLng = null;
  }
  document.getElementById("pinCancelBtn").addEventListener("click", closePinModal);
  document.getElementById("pinSaveBtn").addEventListener("click", function () {
    var name = pinNameInput.value.trim();
    if (!name || !pendingLatLng) { closePinModal(); return; }
    addDoc(pinsCol, { name: name, lat: pendingLatLng.getLat(), lon: pendingLatLng.getLng(), createdAt: serverTimestamp() }).catch(function () {});
    closePinModal();
  });

  function startLongPress(x, y) {
    longPressStart = { x: x, y: y };
    clearTimeout(longPressTimer);
    longPressTimer = setTimeout(function () {
      longPressStart = null;
      openPinModal(screenToLatLng(x, y));
    }, 600);
  }
  function endLongPress() {
    clearTimeout(longPressTimer);
    longPressStart = null;
  }

  // desktop right-click fallback for adding a pin
  mapContainer.addEventListener("contextmenu", function (e) {
    e.preventDefault();
    openPinModal(screenToLatLng(e.clientX, e.clientY));
  });

  mapContainer.addEventListener("pointerdown", onGesturePointerDown);
  mapContainer.addEventListener("pointermove", onGesturePointerMove);
  mapContainer.addEventListener("pointerup", onGesturePointerUp);
  mapContainer.addEventListener("pointercancel", onGesturePointerUp);

  /* ============================================================
     WAKE LOCK
  ============================================================ */
  var wakeBtn = document.getElementById("wakeBtn");
  async function enableWakeLock() {
    if (!("wakeLock" in navigator)) { alert("이 브라우저는 화면 유지 기능을 지원하지 않습니다."); return; }
    try {
      wakeLock = await navigator.wakeLock.request("screen");
      wakeOn = true;
      wakeBtn.classList.add("active");
      wakeLock.addEventListener("release", function () {
        if (wakeOn) wakeBtn.classList.remove("active");
      });
    } catch (e) { wakeOn = false; }
  }
  function disableWakeLock() {
    wakeOn = false;
    wakeBtn.classList.remove("active");
    if (wakeLock) { wakeLock.release().catch(function () {}); wakeLock = null; }
  }
  wakeBtn.addEventListener("click", function () {
    if (wakeOn) disableWakeLock(); else enableWakeLock();
  });
  document.addEventListener("visibilitychange", function () {
    if (wakeOn && document.visibilityState === "visible" && !wakeLock) enableWakeLock();
  });

  /* ============================================================
     DARK MAP TOGGLE
  ============================================================ */
  var darkBtn = document.getElementById("darkBtn");
  darkBtn.addEventListener("click", function () {
    isDark = !isDark;
    mapEl.classList.toggle("dark-map", isDark);
    darkBtn.classList.toggle("active", isDark);
  });

  /* ============================================================
     RESIZE
  ============================================================ */
  window.addEventListener("resize", function () { map.relayout(); });
  setTimeout(function () { map.relayout(); }, 200);

  });
}
</script>
</body>
</html>
